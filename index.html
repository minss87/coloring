<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="컬러링">
<meta name="theme-color" content="#E6E7EA">
<title>컬러링</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>
<div id="app">

  <aside class="col left">
    <div class="card hist">
      <button id="undo" aria-label="되돌리기"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <i></i>
      <button id="redo" aria-label="다시하기"><svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>

    <div class="card slider" aria-label="굵기">
      <svg class="sic" viewBox="0 0 24 24"><circle cx="7" cy="16" r="2" fill="currentColor"/><circle cx="15.5" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <div class="track" id="sizeTrack" role="slider" aria-label="굵기" aria-valuemin="1" aria-valuemax="40">
        <svg class="wedge" viewBox="0 0 40 200" preserveAspectRatio="none"><path d="M5 4 L35 4 L21 196 L19 196 Z"/></svg>
        <div class="thumb"></div>
      </div>
      <div class="val" id="sizeVal"></div>
    </div>

    <div class="card slider" aria-label="농도">
      <svg class="sic" viewBox="0 0 24 24"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 20a6 6 0 0 1-6-6h12a6 6 0 0 1-6 6z" fill="currentColor"/></svg>
      <div class="track" id="opTrack" role="slider" aria-label="농도" aria-valuemin="10" aria-valuemax="100">
        <div class="obar"></div>
        <div class="thumb fixed"></div>
      </div>
      <div class="val" id="opVal"></div>
    </div>

    <button class="card nav" id="navBtn" aria-label="전체 보기">
      <div class="mm" id="mm"><canvas id="mini"></canvas><div class="vp" id="vp"></div></div>
      <span id="zoomVal">100%</span>
    </button>
  </aside>

  <main id="sheet">
    <div id="world">
      <div id="paper"></div>
      <canvas id="paint"></canvas>
      <canvas id="live"></canvas>
      <canvas id="ref"></canvas>
      <svg id="lineart" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="hover"></div>
  </main>

  <aside class="col right">
    <button class="card next" id="newBtn" aria-label="새 도안">
      <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>
      <span>새 도안</span>
    </button>
    <div class="palette" id="palette"></div>
    <div class="spacer"></div>
    <button class="card bcur" id="bcur" aria-label="펜 종류" aria-expanded="false"></button>
  </aside>

  <div class="pop" id="brushMenu" role="menu"></div>

  <!-- 새 도안 -->
  <div class="modal" id="newModal" hidden>
    <div class="sheetbox" role="dialog" aria-modal="true" aria-label="새 도안">
      <div class="mhead">
        <div class="seg" id="detailSeg" role="radiogroup" aria-label="세밀도">
          <button data-v="0" role="radio">간단</button>
          <button data-v="1" role="radio">보통</button>
          <button data-v="2" role="radio">세밀</button>
        </div>
        <button class="iconbtn" id="settingsBtn" aria-label="설정"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="iconbtn" id="closeModal" aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <div class="choices" id="choices">
        <label class="choice" aria-label="이미지 업로드">
          <input type="file" id="fileInput" accept="image/*,.heic,.heif" class="cover-input">
          <svg class="cic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
          <span>이미지 업로드</span>
        </label>
        <button class="choice" id="aiChoice" aria-label="AI 생성">
          <svg class="cic" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
          <span>AI 생성</span>
        </button>
      </div>

      <div class="aibox" id="aiBox" hidden>
        <textarea id="prompt" rows="3" lang="ko" placeholder="바닷가 마을의 노을" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <div class="row">
          <button class="ghostbtn" id="aiBack" aria-label="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="primary" id="aiGo">생성</button>
        </div>
      </div>

      <div class="setbox" id="setBox" hidden>
        <label>Google API 키<span class="keyrow"><input type="text" id="apiKey" class="masked" lang="ko" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button type="button" class="eye" id="keyEye" aria-label="키 보기"><svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
        <label>모델<input type="text" id="apiModel" lang="ko" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label>
        <div class="row"><button class="primary" id="setSave">저장</button></div>
      </div>

      <div class="busy" id="busy" hidden><div class="spin"></div></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="js/main.js?v=4"></script>
</body>
</html>
